services:
  backend:
    build:
      context: ./backend
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGODB_URI=mongodb://mongo:27017/raceapp
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - NODE_ENV=production
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8080:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5005
    depends_on:
      - backend

volumes:
  mongo-data:
